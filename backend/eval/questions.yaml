# Retrieval eval set — the scoreboard every retrieval change is judged against.
#
# Each question records the location(s) that actually contain the answer, read out of the
# repo AT ITS PINNED SHA (eval/repos.py) so these line numbers never drift. A question
# counts as recalled if any hit in the top-k overlaps any one of its answer ranges.
#
# `kind` is the whole point of the breakdown — each kind is a different retriever's job,
# so the by-kind scoreboard says *which* retriever is weak, not just that recall is low:
#   symbol      — a short identifier-shaped query, the way a code search box gets typed
#                 into. Lexical (tsvector) owns these too now — structural (pg_trgm fuzzy
#                 match over code_entities) was tried here and cut after the M5 ablation
#                 showed only a marginal recall gain (see docs/RETRIEVAL.md).
#   keyword     — words that literally appear in the source. Lexical (tsvector) owns these.
#   conceptual  — the user's words appear NOWHERE in the file. Neither cheap retriever can
#                 do anything but get lucky. This bucket was the entire case for building
#                 M6's semantic (embedding) leg, and is what its recall delta is judged on.
#
# Answer ranges are deliberately the enclosing definition (not one line), because a lexical
# hit lands on one line and a structural hit spans the whole symbol — overlap accepts both.

