# ------------------------------------------------------------------ docs guard-rail
# These four are NOT retrieval targets — they exist to catch over-correction. The lexical
# retriever demotes non-source files (`_NON_SOURCE_RANK_FACTOR`) because English prose
# otherwise outranks code on every natural-language query. That penalty is measured against
# an answer set that is 100% source files, so it can only ever look good. These questions
# have their answers genuinely in prose: if the penalty is cranked too hard, they break and
# the scoreboard says so instead of silently rewarding the bias.

- q: "What is the plan for scaling the system once load grows?"
  repo: noetra
  kind: docs
  answers:
